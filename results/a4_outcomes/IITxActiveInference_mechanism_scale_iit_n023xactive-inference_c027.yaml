observable: The minimal spatiotemporal scale at which perturbations or disruptions
  to neural activity selectively disrupt conscious experience, compared to the scale
  at which message-passing or gradient descent dynamics are observed to be necessary
  for conscious report.
outcome_space:
- pattern: Disruption of mesoscale spatiotemporal patterns (e.g., local neural assemblies
    or microcircuits) abolishes conscious experience, even when message-passing or
    gradient descent dynamics at larger or smaller scales are preserved.
  favors: IIT
- pattern: Disruption of message-passing or gradient descent dynamics (e.g., prediction
    error minimization across hierarchical levels), regardless of the specific spatiotemporal
    scale, abolishes conscious experience, even when mesoscale patterns are intact.
  favors: ActInf
- pattern: Both mesoscale spatiotemporal patterns and message-passing/gradient descent
    dynamics must be disrupted to abolish conscious experience; disrupting only one
    is insufficient.
  favors: both
- pattern: Neither disruption selectively abolishes conscious experience; conscious
    report persists despite either or both disruptions.
  favors: neither
