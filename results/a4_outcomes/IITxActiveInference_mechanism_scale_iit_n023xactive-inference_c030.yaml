observable: The minimal spatial and temporal scale at which perturbations or disruptions
  to neural activity selectively abolish conscious experience while preserving unconscious
  processing.
outcome_space:
- pattern: Selective disruption of consciousness occurs only when perturbations target
    mesoscale spatiotemporal patterns (e.g., assemblies spanning multiple columns
    or regions over tens to hundreds of milliseconds), but not when targeting finer
    microcircuit elements.
  favors: IIT
- pattern: Selective disruption of consciousness occurs only when perturbations target
    cortical microcircuit elements (e.g., single columns, microcolumns, or local microcircuit
    motifs at millisecond timescales), but not at broader mesoscale patterns.
  favors: ActInf
- pattern: Both mesoscale and microcircuit perturbations independently disrupt consciousness,
    or neither scale shows selective effects.
  favors: neither
